[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Les fonctions sont exposées sous /api/* (voir `config.path` dans chaque fonction).

# SPA fallback : toute route inconnue renvoie vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
